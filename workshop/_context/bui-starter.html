<html lang="en">
<head>

  <title>BUI starter - Make Backstage page</title>
  <!-- Backstage UI (BUI) styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@backstage/ui@0.18.0/dist/css/styles.css" />
  <!-- Make accent overrides. This is the ONLY place hex colours belong. -->
  <style>
    :root {
      /* Make primary purple */
      --bui-bg-solid: #6d00cc;
      --bui-bg-solid-hover: #5a00a8;
      --bui-bg-solid-pressed: #440080;
      --bui-accent-bg: #6d00cc;
      --bui-accent-bg-hover: #5a00a8;
      --bui-ring: #6d00cc;
      /* Page header title colour */

      /* Link colour (applied to BUI Link below) */

      /* Sidebar gradient */
      --make-sidebar-bg: linear-gradient(180deg, #b55dcd 0, #724ebf 100%);
    }

    /* ---------- Shell (plain HTML: BUI has no sidebar component) ---------- */
    html, body { margin: 0; height: 100%; }
    body { font-family: var(--bui-font-regular); background: var(--bui-bg-app); color: var(--bui-fg-primary); }
    .shell { display: flex; height: 100vh; }

    .sidebar {
      width: 220px; flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--make-sidebar-bg); color: var(--bui-white);
    }
    .sidebar a {
      display: flex; align-items: center; gap: var(--bui-space-3);
      padding: var(--bui-space-3) var(--bui-space-4);
      color: var(--bui-white); text-decoration: none;
      font-size: var(--bui-font-size-3); font-weight: 600;
    }
    .sidebar a:hover { background: rgb(255 255 255 / 0.12); }
    .sidebar a[aria-current="page"] { background: rgb(255 255 255 / 0.2); box-shadow: inset 3px 0 0 var(--bui-white); }
    .sidebar svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .sidebar .brand { padding: var(--bui-space-5) var(--bui-space-4); font-size: var(--bui-font-size-6); font-weight: 700; }
    .sidebar .kbd { margin-left: auto; font-size: var(--bui-font-size-1); border: 1px solid rgb(255 255 255 / 0.6); border-radius: var(--bui-radius-2); padding: 0 var(--bui-space-1); }
    .sidebar .group { border-top: 1px solid rgb(0 0 0 / 0.2); padding: var(--bui-space-2) 0; }
    .sidebar .spacer { flex: 1; }

    .bui-Link { color: var(--make-link); }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .page-header {
      background: var(--bui-bg-neutral-1); border-bottom: 1px solid var(--bui-border-1);
      padding: var(--bui-space-5) var(--bui-space-6);
    }
    .page-header h1 { margin: 0; font-size: var(--bui-font-size-7); font-weight: 700; color: var(--make-title); }
    .content { flex: 1; overflow: auto; padding: var(--bui-space-6); }
  </style>
